name: AppSec Pipeline

# v2 changes:
#  - Semgrep: exclude training snippets + spec files (noise reduction)
#  - Trivy: generate lockfiles first (repo has none), fail if SBOM is empty
#  - DAST: print app logs on failure so we can debug
#  - runs-on pinned to ubuntu-24.04 (ubuntu-latest is migrating to 26 on Oct 19)

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # 1. SAST
  # ---------------------------------------------------------------
  sast-semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep scan (community rules + our custom rules)
        run: |
          docker run --rm -v "${PWD}:/src" -w /src semgrep/semgrep \
            semgrep scan \
              --metrics=off \
              --config p/javascript \
              --config p/nodejs \
              --config .semgrep/rules \
              --severity ERROR \
              --exclude codefixes \
              --exclude '*.spec.ts' \
              --json-output=semgrep-report.json \
              --error
        # --exclude codefixes : Juice Shop's intentionally vulnerable training snippets, not shipped logic
        # --exclude '*.spec.ts': unit tests

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json

  # ---------------------------------------------------------------
  # 2. Secrets
  # ---------------------------------------------------------------
  secrets-gitleaks:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------
  # 3. SCA + SBOM
  # ---------------------------------------------------------------
  sca-trivy:
    name: SCA + SBOM (Trivy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Trivy reads LOCKFILES (package-lock.json). This repo does not commit one,
      # so Trivy saw zero dependencies and passed with an empty SBOM.
      # Resolve the dependency tree into lockfiles first (no install, no scripts).
      - name: Generate lockfiles (backend + frontend)
        run: |
          npm install --package-lock-only --package-lock=true --ignore-scripts --legacy-peer-deps
          (cd frontend && npm install --package-lock-only --package-lock=true --ignore-scripts --legacy-peer-deps)
          ls -la package-lock.json frontend/package-lock.json

      - name: Generate SBOM (CycloneDX)
        run: |
          docker run --rm -v "${PWD}:/project" aquasec/trivy:latest fs \
            --format cyclonedx \
            --output /project/sbom.cdx.json \
            /project

      - name: Sanity check - SBOM must not be empty
        run: |
          COUNT=$(jq '.components | length' sbom.cdx.json)
          echo "SBOM components: $COUNT"
          test "$COUNT" -gt 0

      - name: Vulnerability gate (High/Critical that have a fix available)
        run: |
          docker run --rm -v "${PWD}:/project" aquasec/trivy:latest fs \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            /project

      - name: Keep the SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

  # ---------------------------------------------------------------
  # 4. DAST
  # ---------------------------------------------------------------
  dast-zap:
    name: DAST (ZAP baseline)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build the app from this commit
        run: docker build -t app-under-test .
        # If this step is the one that fails, replace the line above with:
        #   docker pull bkimminich/juice-shop:latest && docker tag bkimminich/juice-shop:latest app-under-test

      - name: Start the app
        run: |
          docker network create zapnet
          docker run -d --name target --network zapnet -p 3000:3000 app-under-test
          for i in $(seq 1 40); do
            curl -sf http://localhost:3000 > /dev/null && echo "app is up" && break
            sleep 3
          done

      - name: ZAP baseline scan (passive checks only - safe, fast)
        run: |
          mkdir -p zap-out && chmod 777 zap-out
          docker run --rm --network zapnet \
            -v "${PWD}/zap-out:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://target:3000 \
              -r zap-report.html -J zap-report.json -I

      - name: Debug - show app logs if anything failed
        if: failure()
        run: docker logs target || true

      - name: Keep the ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-out/
