name: AppSec Pipeline

# Runs on every push, every pull request, and manually from the Actions tab.
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# Least privilege: the pipeline can only read the repo.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # 1. SAST - scans SOURCE CODE for insecure patterns (no app running)
  # ---------------------------------------------------------------
  sast-semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep scan (community rules + our custom rules)
        run: |
          docker run --rm -v "${PWD}:/src" -w /src semgrep/semgrep \
            semgrep scan \
              --metrics=off \
              --config p/javascript \
              --config p/nodejs \
              --config .semgrep/rules \
              --severity ERROR \
              --json-output=semgrep-report.json \
              --error
        # --severity ERROR = only the high-confidence/high-impact rules count
        # --error          = exit code 1 if anything is found -> THIS is the gate

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json

  # ---------------------------------------------------------------
  # 2. Secrets - API keys, tokens, private keys committed to the repo
  # ---------------------------------------------------------------
  secrets-gitleaks:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: a secret deleted in a later commit is still leaked

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Free for personal accounts. Organisation repos need a license key.

  # ---------------------------------------------------------------
  # 3. SCA - vulnerable third-party libraries + SBOM
  # ---------------------------------------------------------------
  sca-trivy:
    name: SCA + SBOM (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate SBOM (CycloneDX) - the inventory of every dependency
        run: |
          docker run --rm -v "${PWD}:/project" aquasec/trivy:latest fs \
            --format cyclonedx \
            --output /project/sbom.cdx.json \
            /project

      - name: Vulnerability gate (High/Critical that have a fix available)
        run: |
          docker run --rm -v "${PWD}:/project" aquasec/trivy:latest fs \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            /project
        # --exit-code 1 on findings = the gate
        # --ignore-unfixed = don't block devs on things they cannot fix yet

      - name: Keep the SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

  # ---------------------------------------------------------------
  # 4. DAST - attack the RUNNING app (built from this exact commit)
  # ---------------------------------------------------------------
  dast-zap:
    name: DAST (ZAP baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the app from this commit
        run: docker build -t app-under-test .
        # Slow? Replace with: docker pull bkimminich/juice-shop && docker tag bkimminich/juice-shop app-under-test

      - name: Start the app
        run: |
          docker network create zapnet
          docker run -d --name target --network zapnet -p 3000:3000 app-under-test
          for i in $(seq 1 40); do
            curl -sf http://localhost:3000 > /dev/null && echo "app is up" && break
            sleep 3
          done

      - name: ZAP baseline scan (passive checks only - safe, fast)
        run: |
          mkdir -p zap-out && chmod 777 zap-out
          docker run --rm --network zapnet \
            -v "${PWD}/zap-out:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://target:3000 \
              -r zap-report.html -J zap-report.json -I
        # -I = report-only. To gate on specific alerts, add a rules file with -c
        #      and set the chosen rule IDs to FAIL.

      - name: Keep the ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-out/
